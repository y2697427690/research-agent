# nginx 反向代理配置（可选，用于后续绑定域名 / HTTPS）
#
# 当前部署直接访问 http://<IP>:8000 即可，本文件暂时用不到。
# 若之后申请了域名并完成备案，可按下面配置把 80/443 转发到本地 8000。
#
# 使用方式：
#   sudo apt install -y nginx
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/research-agent
#   sudo ln -s /etc/nginx/sites-available/research-agent /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    # 换成你的域名；未备案时请继续用 IP:8000 访问
    server_name example.com;

    client_max_body_size 200m;   # 与 APP_MAX_UPLOAD_MB 保持一致

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出必需：关闭缓冲，否则回答会「憋一大段才显示」
        proxy_buffering off;
        proxy_cache off;
        # LLM 生成较慢，读超时需要放宽
        proxy_read_timeout 300s;
    }

    # 接口文档（含本地静态资源）
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # 静态资源可缓存
        expires 7d;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # 前端静态页面
    location / {
        root /opt/research-agent/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

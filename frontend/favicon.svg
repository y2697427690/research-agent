<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    科研小助手 Agent 的站点图标
    设计说明：
      · 学术蓝渐变底（与应用主色 --brand-500 / --brand-600 一致）
      · 白色论文页：右下折角，点明「科研文献」
      · 金色四角星芒：呼应界面里的 ✦ 与「基石论文」的琥珀色，
        表达「AI 把文献提炼成洞察」
    在 16px 下只保留三个视觉元素（蓝底、白页、金星），
    避免细节糊成一团。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a86f7" />
      <stop offset="1" stop-color="#2456c9" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)" />

  <!-- 论文页：左上到右下，折角在右上 -->
  <path d="M9.5 6.5h7.2l4.3 4.3v12.4a1.8 1.8 0 0 1-1.8 1.8H9.5a1.8 1.8 0 0 1-1.8-1.8V8.3a1.8 1.8 0 0 1 1.8-1.8z"
        fill="#ffffff" />
  <path d="M16.7 6.5l4.3 4.3h-4.3z" fill="#cfe0ff" />

  <!-- 两行文字示意（16px 下会淡出，不影响识别） -->
  <rect x="10.4" y="14.2" width="6.4" height="1.3" rx="0.65" fill="#4a86f7" fill-opacity="0.55" />
  <rect x="10.4" y="17.2" width="4.6" height="1.3" rx="0.65" fill="#4a86f7" fill-opacity="0.4" />

  <!-- 金色星芒：位于右上角，压在页面边缘上 -->
  <path d="M23.4 15.2l1.25 2.75 2.75 1.25-2.75 1.25-1.25 2.75-1.25-2.75-2.75-1.25 2.75-1.25z"
        fill="#ffcf5c" />
</svg>

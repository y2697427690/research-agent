<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>科研小助手 Agent · Research Copilot</title>
<meta name="description" content="面向科研文献的 AI Agent 前端演示：PDF 解析、内容去重、RAG 问答、中英对照阅读、引用图谱、论文推荐与写作助手。" />

<!-- 站点图标：蓝底 + 白论文页 + 金色星芒。
     SVG 供现代浏览器使用（矢量、清晰），ICO 作为兜底，
     同时让浏览器自动请求的 /favicon.ico 也能命中（原先返回 404，
     控制台里每次刷新都有一条红字，看日志时很碍眼）。 -->
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="favicon.ico" />

<link rel="stylesheet" href="styles/theme.css" />
<link rel="stylesheet" href="styles/app.css" />
<link rel="stylesheet" href="styles/views.css" />
<script>
  /* 主题必须在首次绘制之前确定，否则会先按默认色画一帧再切到深色，
     出现明显的「闪白/闪黑」。这里只做读取与写入属性，不依赖任何脚本。 */
  (function () {
    try {
      var saved = localStorage.getItem('app.theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.dataset.theme = saved;
      }
    } catch (e) {
      /* localStorage 被禁用时忽略，使用默认浅色 */
    }
  })();
</script>
</head>
<body>

<!-- ============================================================
     应用挂载点：整页 DOM 由 scripts/core/app.js 的 buildShell() 生成
     ============================================================ -->
<div id="app"></div>

<!-- ============================================================
     脚本加载顺序（自底向上，不能随意调换）：
       1. util.js          工具函数（其他所有文件都依赖它）
       2. mock-data.js     演示数据（store 初始化时会用到）
       3. components.js    公共 UI 组件（Toast / 弹窗）
       4. store.js         状态中心 + 业务动作（依赖 data / dedupe / rag / writer）
       5. rag.js           检索引擎
       6. dedupe.js        去重与版本差异
       7. writer.js        写作助手算法
       8. views/*.js       八个视图，各自向 App.views 注册
       9. app.js           视图注册表 + 路由 + 启动（必须最后加载）
     ============================================================ -->

<!-- 1. 核心工具 -->
<script src="scripts/core/util.js"></script>

<!-- 2. 演示数据（真实项目可替换为接口层） -->
<script src="scripts/data/mock-data.js"></script>
<!-- 后端数据 → 视图数据的字段适配层（P8 联调用） -->
<script src="scripts/data/adapter.js"></script>

<!-- 3. 算法与业务能力 -->
<script src="scripts/core/rag.js"></script>
<script src="scripts/core/dedupe.js"></script>
<script src="scripts/core/writer.js"></script>

<!-- 4. 公共组件与状态中心 -->
<script src="scripts/core/components.js"></script>
<script src="scripts/core/api.js"></script>
<script src="scripts/core/store.js"></script>

<!-- 5. 视图层（顺序无关，只依赖上面几层） -->
<script src="scripts/views/dashboard.js"></script>
<script src="scripts/views/library.js"></script>
<script src="scripts/views/reader.js"></script>
<script src="scripts/views/qa.js"></script>
<script src="scripts/views/graph.js"></script>
<script src="scripts/views/discover.js"></script>
<script src="scripts/views/writing.js"></script>
<script src="scripts/views/guide.js"></script>

<!-- 6. 应用入口：注册视图、渲染外壳、启动 -->
<script src="scripts/core/app.js"></script>
<script>
  // DOM 就绪后启动应用
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', App.boot);
  } else {
    App.boot();
  }
</script>
</body>
</html>

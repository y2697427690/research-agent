[project]
name = "research-assistant-backend"
version = "0.1.0"
description = "科研小助手 Agent 后端：PDF 解析，RAG 问答，引用溯源"
requires-python = ">=3.11"
dependencies = [
    # web框架
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15",
    "orjson>=3.13",
    # SQLAlchemy 的 async 支持需要 greenlet，必须写 [asyncio] 否则 import 就报错
    "SQLAlchemy[asyncio]>=2.1,<3",
    "aiosqlite>=0.22",
    "alembic>=1.20",

    # PDF 解析：PyMuPDF 是官方推荐工具，能一次拿到文字/坐标/字号/表格
    "PyMuPDF>=1.28",

    # 大模型与网络（OpenAI 兼容，DeepSeek 也用这个 SDK）
    "httpx>=0.28",
    "openai>=1.54,<4",
    "tenacity>=9.2",

    # 图论：官方技术栈点名的引用网络分析库
    "networkx>=3.2",

    # 定时任务（arXiv 定期抓取）
    "APScheduler>=3.11",

    # 数据处理
    "numpy>=2.0",
    "pandas>=2.2",
    "arxiv>=2.1",
]

[project.optional-dependencies]
# 向量检索：会拉进 torch 耗时长，先不装。需要时再：pip install -e ".[vectors]"
vectors = ["sentence-transformers>=3.3", "torch>=2.2"]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "respx>=0.23", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W 基础规范  F 未使用变量  I import 排序  N 命名  UP 语法升级  B 常见陷阱  SIM 可简化
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"